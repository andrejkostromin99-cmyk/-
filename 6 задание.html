    <form id="myForm">

        <p>Ваше имя<input type="text" id="name"></p>
        
        <p>Пароль<input type="password" id="pass"></p>
        
        <p>Подтверждение пароля<input type="password" id="pass2"></p>
        
        <p>Электронный адрес:<input type="text" id="email"></p>
        
        <p>Тема сообщения: <input type="text"></p>
        
        <p>Сообщение:<br>
        <textarea id="msg" rows="5" cols="30"></textarea></p>
        
        <button type="button" onclick="proverka()">Отправить</button>
        <button type="reset">Очистить</button>
    </form>

    <p>необходимые для заполнения поля</p>

    <script>
        function proverka() {
            
            let name = document.getElementById("name").value;
            let pass = document.getElementById("pass").value;
            let pass2 = document.getElementById("pass2").value;
            let email = document.getElementById("email").value;
            let msg = document.getElementById("msg").value;

            
            if (name == "") {
                alert("Введите имя!");
                document.getElementById("name").focus();
                return;
            }

            
            if (pass.length <= 4) {
                alert("Пароль должен быть больше 4 символов!");
                document.getElementById("pass").focus();
                return;
            }

            
            if (pass2 != pass) {
                alert("Пароли не совпадают!");
                document.getElementById("pass2").focus();
                return;
            }

            
            if (email.indexOf("@") == -1) {
                alert("Введите правильный email (нужен символ @)!");
                document.getElementById("email").focus();
                return;
            }

            
            if (msg.length <= 10) {
                alert("Сообщение должно быть длиннее 10 символов!");
                document.getElementById("msg").focus();
                return;
            }

           
            alert("Всё верно! Форма отправлена.");
        }
    </script>
