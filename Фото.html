<title>Выбор картинки</title> 
<style> 
.bas {position: relative; width: 1000px; margin: auto;} 
.im {width: 300px; border: 1px solid #000000; margin: 10px;} 
 nav { background: #2c3e50; padding: 15px; text-align: center; }
    nav a { color: white; text-decoration: none; margin: 0 15px; font-size: 16px; }
    nav a:hover { color: #3498db; }
    body { font-family: 'Times New Roman', Times, serif; background: #f4f4f9; margin: 0; }
</style> 
 
<script> 
addEventListener("mouseover", (ev)=> 
{ 
let e=ev.target; 
 
if(e.tagName=="IMG") 
   { 
   for(let i=1; i<7; i++) 
      { 
      let b="i"+i; 
      if(e.id!=b) 
         { 
         let t=document.getElementById(b).style; 
          t.transition="opacity 1s"; 
          t.opacity=0.1; 
          } 
       } 
   } 
else 
   { 
   for(let i=1; i<7; i++) 
      { 
      let b="i"+i; 
      let t=document.getElementById(b).style; 
      t.transition="opacity 2s"; 
      t.opacity=1; 
      } 
   } 
}); 
</script> 
</head>
