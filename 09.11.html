<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сетка</title>
    <style>
        body {
            background-color: #e6f0fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .grid-container {
            background-color: #d0e0f0;
            padding: 20px;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.1);
            border-top: 2px solid #fff;
            border-bottom: 4px solid #a0b0c0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px; 
            background-color: #a0b0c0;
            padding: 3px;
        }

        .cell {
            width: 35px;
            height: 35px;
            user-select: none; 
        }

        .cyan {
            background-color: #20b2aa;
        }
        .dark-blue {
            background-color: #1e1b8e;
        }

        .cell:hover {
            opacity: 0.8;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="grid" id="myGrid"></div>
    </div>

    <script>
        const grid = document.getElementById('myGrid');

        const rows = 10;
        const cols = 10;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');

                let isDarkBlue = false;

                if (r === 0 && c >= 9) isDarkBlue = true;
                else if (r === 1 && c >= 8) isDarkBlue = true;
                else if (r === 2 && c >= 7) isDarkBlue = true;
                else if (r === 3 && c >= 6) isDarkBlue = true;
                else if (r === 4 && c >= 5) isDarkBlue = true;
                else if (r === 5 && c >= 4) isDarkBlue = true;
                else if (r === 6 && c >= 3) isDarkBlue = true;
                else if (r === 7 && c >= 2) isDarkBlue = true;
                else if (r === 8 && c >= 1) isDarkBlue = true;
                else if (r === 9) isDarkBlue = true; 

                if (isDarkBlue) {
                    cell.classList.add('dark-blue');
                } else {
                    cell.classList.add('cyan');
                }

                cell.addEventListener('click', () => {
                    if (cell.classList.contains('cyan')) {
                        cell.classList.remove('cyan');
                        cell.classList.add('dark-blue');
                    } else {
                        cell.classList.remove('dark-blue');
                        cell.classList.add('cyan');
                    }
                });

                grid.appendChild(cell);
            }
        }
    </script>
</body>
</html>
