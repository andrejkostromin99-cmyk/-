    <section id="list-task">
        <h2>Список группы</h2>
        <p onclick="add_to_list()" style="cursor:pointer; color:#3498db; font-weight:bold;">
            Добавить в список
        </p>
        <ol id="list"></ol>
    </section>
    
<script>
  var arr = ["Ivanov", "Petrov", "Sidorov"];
    var counter = 0;

    function add_to_list() {
        if (typeof(arr[counter]) != "undefined") {
            var list = document.getElementById('list');
            var li = document.createElement('LI');
            li.innerHTML = arr[counter];
            list.appendChild(li);
            counter++;
        }
    }
</script>
